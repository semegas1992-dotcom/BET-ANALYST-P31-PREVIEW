<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BET ANALYST · Mise à jour</title><style>body{background:#0d141e;color:#f0f5fa;max-width:500px;margin:12vh auto;padding:24px;font:16px/1.6 system-ui}h1{font-size:26px}p{color:#bdcddd}button,a{display:inline-block;background:#9ce8c4;color:#10261e;padding:14px 18px;border:0;border-radius:10px;font:inherit;font-weight:700}a{margin-top:18px}</style><h1>Une lecture plus claire.</h1><p id="status" role="status">Actualisation de l’interface en cours. Tes rapports et ton calendrier sont conservés.</p><button id="retry" hidden>Réessayer</button><a href="./" id="open" hidden>Ouvrir BET ANALYST</a><script>
async function upgrade(){document.getElementById('retry').hidden=true;try{if(!('serviceWorker' in navigator))throw Error('Navigateur incompatible');const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});await reg.update();const start=Date.now();while(Date.now()-start<20000){for(const name of await caches.keys()){if(name==='bet-mobile-hybrid-v3'){const c=await caches.open(name),r=await c.match(new URL('./index.html',location.href).href);if(r&&(await r.text()).includes('3 SPORTS')){document.getElementById('status').textContent='Nouvelle interface prête. Tes données ont été conservées.';document.getElementById('open').hidden=false;location.replace('./');return}}}await new Promise(r=>setTimeout(r,300))}throw Error('La mise à jour prend plus de temps que prévu.')}catch(e){document.getElementById('status').textContent='Mise à jour non terminée. Vérifie ta connexion puis réessaie. Tes données n’ont pas été effacées.';document.getElementById('retry').hidden=false;document.getElementById('open').hidden=false}}
document.getElementById('retry').onclick=upgrade;upgrade();</script></html>
