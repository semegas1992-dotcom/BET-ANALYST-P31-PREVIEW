name: P32 UTM targeted regression
on:
  push:
    branches: [main]
    paths: ['p32b/sw.js','p32-utm.cjs','.github/workflows/p32-utm.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8768 --bind 127.0.0.1 > /tmp/p32-http.log 2>&1 &
          node p32-utm.cjs
