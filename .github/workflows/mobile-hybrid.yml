name: Mobile hybrid end-to-end
on:
  push:
    paths: ['mobile/**','mobile-regression.cjs','.github/workflows/mobile-hybrid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test mobile/store.test.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Mobile, offline and backup regression
        run: |
          python -m http.server 8769 --bind 127.0.0.1 > /tmp/mobile-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8769/mobile/ >/dev/null && break; sleep 1; done
          node mobile-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-hybrid-evidence
          path: mobile-evidence/
          retention-days: 30
